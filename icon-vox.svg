<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vox-Pack-Web">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e9bff"/>
      <stop offset="1" stop-color="#3ddc5a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c7fe0"/>
      <stop offset="1" stop-color="#5cb8ff"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0b1626"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 10 40 10"/>
  <circle cx="32" cy="32" r="21" fill="url(#sky)"/>

  <!-- Radiocommande RC façon TX16S : antenne centrale, anse, interrupteurs aux coins,
       manches en haut, grand écran en bas -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M32 21V12" stroke-width="2.3"/>
    <path d="M25 21.5V18.6h14v2.9" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M20.6 21.6 18.9 18.2M23.2 21.2 22.4 17.9M43.4 21.6l1.7-3.4M40.8 21.2l.8-3.3" stroke-width="1.4"/>
  </g>
  <!-- boîtier -->
  <rect x="18.5" y="21" width="27" height="26" rx="5" fill="#fff"/>
  <!-- manches (gimbals) -->
  <g fill="#1c7fe0" stroke="#7cc4ff" stroke-width=".7">
    <circle cx="25" cy="27.8" r="4.4"/>
    <circle cx="39" cy="27.8" r="4.4"/>
  </g>
  <!-- manches inclinés (comme tenus en vol), pas centrés -->
  <g stroke="#fff" stroke-width="1.3" stroke-linecap="round">
    <path d="M25 27.8 23.6 30M39 27.8l1.9-1.4"/>
  </g>
  <g fill="#fff">
    <circle cx="23.6" cy="30" r="1.5"/>
    <circle cx="40.9" cy="26.4" r="1.5"/>
  </g>
  <!-- bouton central -->
  <rect x="31.2" y="24.5" width="1.6" height="5" rx=".8" fill="#8fb8d8"/>
  <!-- repères à gauche de l'écran, molette à droite -->
  <path d="M20.2 36.5h1.4M20.2 39.2h1.4M20.2 41.9h1.4" stroke="#1c7fe0" stroke-width="1" stroke-linecap="round"/>
  <rect x="42.4" y="36.2" width="1.5" height="5.8" rx=".7" fill="#1c7fe0"/>
  <!-- grand écran avec onde audio -->
  <rect x="22.5" y="34" width="19" height="10.5" rx="1.3" fill="#0b1626"/>
  <g stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round">
    <path d="M25 39.25h.01"/>
    <path d="M27 37.75v3"/>
    <path d="M29.5 36.5v5.5"/>
    <path d="M32 35.5v7.5"/>
    <path d="M34.5 36.5v5.5"/>
    <path d="M37 37.75v3"/>
    <path d="M39 39.25h.01"/>
  </g>
</svg>
